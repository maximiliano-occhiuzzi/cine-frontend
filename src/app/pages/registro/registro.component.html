<div class="auth-container">
  <div class="auth-card">
    <div class="logo-auth">CINEMARK</div>
    <h2>Crear cuenta</h2>

    <div class="field">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Walter" />
    </div>
    <div class="field">
      <label>Apellido</label>
      <input type="text" [(ngModel)]="apellido" name="apellido" placeholder="Quispe Pretel" />
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="walter@mail.com" />
    </div>
    <div class="field">
      <label>Usuario</label>
      <input type="text" [(ngModel)]="username" name="username" placeholder="elegí un usuario" />
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" (keyup.enter)="registrarme()" />
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button class="btn-primary" [disabled]="cargando" (click)="registrarme()">
      {{ cargando ? 'Creando cuenta...' : 'Registrarme' }}
    </button>

    <p class="switch-auth">
      ¿Ya tenés cuenta? <a routerLink="/login" [queryParams]="{ returnUrl: returnUrl }">Iniciá sesión</a>
    </p>
  </div>
</div>
