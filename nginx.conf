# Config minima para servir una SPA de Angular con routing propio (Router
# con rutas tipo /cartelera, /historial, etc. que no existen como archivo
# real en disco): sin el "try_files ... /index.html" de abajo, nginx busca
# ese path como archivo y devuelve 404 cada vez que alguien entra
# directamente a una URL interna o refresca la pagina (F5) estando en una.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos que Angular ya versiona en el nombre (main.a1b2c3.js, etc.)
    # pueden cachearse agresivo: si cambia el contenido, cambia el nombre.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }
}
