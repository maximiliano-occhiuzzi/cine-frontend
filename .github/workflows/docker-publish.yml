name: Build y publicar imagen en Docker Hub

# Corre en GitHub (no en tu PC): compila el Dockerfile del front (Angular +
# nginx) y lo sube a Docker Hub como maxmegafuego/cine-front:latest. Se
# dispara solo con cada push a main, o a mano desde la pestaña "Actions" del
# repo (workflow_dispatch).
#
# Requiere 2 secrets en ESTE repo (es distinto del repo cine-main, los
# secrets no se comparten entre repos -> hay que cargarlos de nuevo aca):
#   DOCKERHUB_USERNAME = maxmegafuego
#   DOCKERHUB_TOKEN    = el mismo Access Token de Docker Hub que usaste en
#                        cine-main (Account Settings -> Security -> New
#                        Access Token) -- NUNCA tu contraseña.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push cine-front
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cine-front:latest
          cache-from: type=gha,scope=cine-front
          cache-to: type=gha,mode=max,scope=cine-front
